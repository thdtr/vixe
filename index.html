<body>
<main id="stage">
  <canvas id="screen" aria-label="VIXE"></canvas>
</main>

<div id="touch" hidden>
  <div class="lane left">
    <span class="pad left"></span>
    <span class="pad right"></span>
  </div>
  <div class="lane right">
    <span class="pad jump"></span>
  </div>
  <button class="pause" data-action="pause" data-hold="restart" aria-label="pause"></button>
</div>

<div id="rotate"><pre>
 .--.
 |@ |      .------.
 |  |  -&gt;  | @  &gt; |
 |  |      '------'
 '--'</pre><p></p></div>
