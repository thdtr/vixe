<body>
<main id="stage">
  <canvas id="screen" aria-label="VIXE"></canvas>
</main>

<div id="touch" hidden>
  <div class="stick"><i></i></div>
  <div class="tap"></div>
  <button class="pause" data-action="pause" data-hold="restart"></button>
</div>

<div id="rotate"><pre>
 .--.
 |@ |      .------.
 |  |  -&gt;  | @  &gt; |
 |  |      '------'
 '--'</pre><p></p></div>

<div id="phone" hidden>
  <pre>
 .------------------.
 | [][][][][][][][] |
 |  [][][][][][][]  |
 |   [__________]   |
 '------------------'</pre>
  <p class="say"></p>
  <p class="why"></p>
  <p class="wait"></p>
  <div class="go">
    <button class="share"></button>
    <button class="anyway"></button>
  </div>
  <p class="pad"></p>
</div>
