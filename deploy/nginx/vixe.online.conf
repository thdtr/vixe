# VIXE on https://vixe.online, served by the host nginx.
# Installed by deploy/setup-vps.sh once the Let's Encrypt certificate exists.

server_tokens off;

# Anything that isn't vixe.online (bare IP, scanners, stale DNS) gets dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Plain HTTP: answer ACME challenges, send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name vixe.online www.vixe.online;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://vixe.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vixe.online;

    ssl_certificate     /etc/letsencrypt/live/vixe.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vixe.online/privkey.pem;

    return 301 https://vixe.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vixe.online;

    ssl_certificate     /etc/letsencrypt/live/vixe.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vixe.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vixe_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/vixe/current;
    index index.html;
    charset utf-8;

    # Files are small and unhashed, and the service worker is network-first,
    # so let the browser revalidate everything against the ETag.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Dotfiles never ship, but refuse them anyway.
    location ~ /\. {
        return 404;
    }
}
