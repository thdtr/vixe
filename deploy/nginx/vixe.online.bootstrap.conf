# Temporary config used only until the first certificate is issued:
# answers ACME challenges over HTTP so certbot can prove the domain.
server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name vixe.online www.vixe.online;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 503;
    }
}
