name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Validate JSON
        run: |
          find . -path ./.git -prune -o \( -name '*.json' -o -name '*.webmanifest' \) -print0 |
            xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'

      - name: Check JavaScript syntax
        run: |
          # The game ships native ES modules with no package.json; tell node so.
          echo '{"type":"module"}' > package.json
          find assets sw.js -name '*.js' -print0 | xargs -0 -n1 node --check
          rm package.json

      - name: Check packs
        run: |
          node - <<'JS'
          const fs = require('fs');
          const root = 'assets/packs/';
          const { packs } = JSON.parse(fs.readFileSync(root + 'manifest.json', 'utf8'));
          let bad = 0;
          const need = (p) => { if (!fs.existsSync(p)) { console.error('missing: ' + p); bad++; } };
          for (const id of packs) {
            const dir = root + id + '/';
            need(dir + 'pack.json');
            if (!fs.existsSync(dir + 'pack.json')) continue;
            const pack = JSON.parse(fs.readFileSync(dir + 'pack.json', 'utf8'));
            for (const w of pack.worlds ?? []) need(dir + w);
            if (pack.script) need(dir + pack.script);
          }
          if (bad) process.exit(1);
          console.log(`ok: ${packs.length} pack(s)`);
          JS

      - name: Smoke test
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          for i in $(seq 20); do curl -fs http://localhost:8000/ >/dev/null && break; sleep 0.25; done
          for f in / index.html sw.js manifest.webmanifest assets/js/main.js \
                   assets/i18n/en.json assets/i18n/pt-BR.json assets/packs/manifest.json; do
            curl -fsS -o /dev/null "http://localhost:8000/$f" && echo "ok $f"
          done

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://vixe.online
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build site
        run: |
          mkdir dist
          cp -r index.html manifest.webmanifest sw.js assets LICENSE dist/
          echo "$GITHUB_SHA" > dist/version.txt

      - name: Ship to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's forced command unpacks stdin and swaps the release.
          tar -czf - -C dist . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$DEPLOY_HOST"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Verify
        run: |
          for i in $(seq 10); do
            live=$(curl -fsS https://vixe.online/version.txt || true)
            [ "$live" = "$GITHUB_SHA" ] && { echo "live: $live"; exit 0; }
            sleep 3
          done
          echo "expected $GITHUB_SHA, got '$live'" >&2
          exit 1
